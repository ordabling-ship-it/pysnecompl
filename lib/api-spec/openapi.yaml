openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Treasure Hunt Szczecin API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markers
    description: Treasure marker operations
  - name: auth
    description: Authentication operations
  - name: payments
    description: Creator pin package payments
  - name: redemptions
    description: Code redemption operations
  - name: games
    description: Podchody outdoor games
paths:
  /payments/checkout-session:
    post:
      operationId: createPinCheckoutSession
      tags: [payments]
      summary: Create a Stripe Checkout session for a creator pin package
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packageId:
                  type: string
                  enum: [start, growth, popular, event]
              required: [packageId]
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                required: [url]
        "401":
          description: Creator session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Stripe is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/checkout-session/{sessionId}:
    get:
      operationId: getPinCheckoutStatus
      tags: [payments]
      summary: Get the status of the signed-in creator's Stripe Checkout session
      security:
        - AdminSession: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment and current pin balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, paid, failed, expired]
                  pinBalance:
                    type: integer
                  bonusPins:
                    type: integer
                  firstPurchaseBonusGranted:
                    type: boolean
                required: [status, pinBalance, bonusPins, firstPurchaseBonusGranted]
        "404":
          description: Session not found for this creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [payments]
      summary: Receive signed Stripe payment events
      description: Signature is verified against the raw request body using STRIPE_WEBHOOK_SECRET.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event received
        "400":
          description: Invalid Stripe signature

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/admin-login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/guest-login:
    post:
      operationId: guestLogin
      tags: [auth]
      summary: Guest login via treasure code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAuthResponse"
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /markers:
    get:
      operationId: listMarkers
      tags: [markers]
      summary: List all markers (admin only)
      responses:
        "200":
          description: List of markers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Marker"
    post:
      operationId: createMarker
      tags: [markers]
      summary: Create a new treasure marker (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarkerBody"
      responses:
        "201":
          description: Created marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marker"

  /markers/{id}:
    get:
      operationId: getMarker
      tags: [markers]
      summary: Get a marker by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marker"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMarker
      tags: [markers]
      summary: Delete a marker (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /redemptions:
    get:
      operationId: listRedemptions
      tags: [redemptions]
      summary: List redemptions for a user
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redemption"

  /stats:
    get:
      operationId: getStats
      tags: [markers]
      summary: Get overall stats (admin view)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List the signed-in organizer's games
      responses:
        "200":
          description: Games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSummary"
    post:
      operationId: createGame
      tags: [games]
      summary: Publish a Podchody game and charge one pin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Published game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedGame"
        "402":
          description: No pins left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /games/join:
    post:
      operationId: joinGame
      tags: [games]
      summary: Join a game with its code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameBody"
      responses:
        "200":
          description: Existing player session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
        "201":
          description: New player session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /games/session:
    get:
      operationId: getGameSession
      tags: [games]
      summary: Current player session
      parameters:
        - name: gameId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Player session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /games/session/attempt:
    post:
      operationId: attemptCheckpoint
      tags: [games]
      summary: Submit the current checkpoint code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckpointAttemptBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /games/session/rating:
    post:
      operationId: rateOrganizer
      tags: [games]
      summary: Rate the organizer once after finishing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameRatingBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /games/{gameId}:
    get:
      operationId: getGame
      tags: [games]
      summary: Organizer view of one game, including checkpoint answers
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerGame"

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: pysne_admin_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AdminLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    GuestLoginBody:
      type: object
      properties:
        code:
          type: string
      required:
        - code

    AuthResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        slug:
          type: string
        pinBalance:
          type: integer
        firstPurchaseBonusGranted:
          type: boolean
        canAccessAnalytics:
          type: boolean
      required:
        - id
        - name
        - role
        - canAccessAnalytics

    GuestAuthResponse:
      type: object
      properties:
        markerId:
          type: integer
        code:
          type: string
        markerTitle:
          type: string
        markerDescription:
          type: string
        imageUrl:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        markerExpiresAt:
          type: string
          description: ISO timestamp when the treasure code becomes inactive. Set on the FIRST successful guest-login (NOW + 60min). Drives the single bottom-of-screen red countdown.
      required:
        - markerId
        - code
        - markerTitle
        - markerDescription
        - imageUrl
        - lat
        - lng
        - markerExpiresAt

    Marker:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        code:
          type: string
        lat:
          type: number
        lng:
          type: number
        category:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
          description: Null in the marker list. The single-marker response includes the photo when one was saved.
        hasImage:
          type: boolean
        createdAt:
          type: string
        expiresAt:
          type: ["string", "null"]
          description: ISO timestamp when the code expires. Null = timer not started yet.
        activatedAt:
          type: ["string", "null"]
          description: ISO timestamp when the FIRST guest activated the code. Null = not activated yet. Set atomically together with expiresAt.
        redemptionCount:
          type: integer
      required:
        - id
        - title
        - description
        - code
        - lat
        - lng
        - imageUrl
        - hasImage
        - createdAt
        - expiresAt
        - activatedAt
        - redemptionCount

    CreateMarkerBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        lat:
          type: number
        lng:
          type: number
        category:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
      required:
        - title
        - description
        - lat
        - lng

    Redemption:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        markerId:
          type: integer
        markerTitle:
          type: string
        redeemedAt:
          type: string
      required:
        - id
        - userId
        - markerId
        - markerTitle
        - redeemedAt

    Stats:
      type: object
      properties:
        totalMarkers:
          type: integer
        activeMarkers:
          type: integer
        expiredMarkers:
          type: integer
        totalRedemptions:
          type: integer
      required:
        - totalMarkers
        - activeMarkers
        - expiredMarkers
        - totalRedemptions

    GameSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        joinCode:
          type: string
        createdAt:
          type: string
        checkpointCount:
          type: integer
        playerCount:
          type: integer
        finishedCount:
          type: integer
        organizerScore:
          type: integer
      required: [id, title, description, joinCode, createdAt, checkpointCount, playerCount, finishedCount, organizerScore]
    PublishedGame:
      allOf:
        - $ref: "#/components/schemas/GameSummary"
        - type: object
          properties:
            charged:
              type: boolean
            pinBalance:
              type: integer
          required: [charged, pinBalance]
    CreateGameBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        checkpoints:
          type: array
          items:
            type: object
            properties:
              hint:
                type: string
              answerCode:
                type: string
              lat:
                type: number
              lng:
                type: number
              imageUrl:
                type: ["string", "null"]
            required: [hint, answerCode, lat, lng]
      required: [title, description, checkpoints]
    JoinGameBody:
      type: object
      properties:
        code:
          type: string
        nickname:
          type: string
        teamName:
          type: ["string", "null"]
      required: [code, nickname]
    CheckpointAttemptBody:
      type: object
      properties:
        gameId:
          type: integer
        answer:
          type: string
      required: [gameId, answer]
    GameRatingBody:
      type: object
      properties:
        gameId:
          type: integer
        value:
          type: integer
          enum: [1, -1]
      required: [gameId, value]
    GameArea:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        radiusMeters:
          type: integer
      required: [lat, lng, radiusMeters]
    GameCheckpointView:
      type: object
      properties:
        position:
          type: integer
        hint:
          type: string
        imageUrl:
          type: ["string", "null"]
        area:
          $ref: "#/components/schemas/GameArea"
      required: [position, hint, imageUrl, area]
    GameRankingEntry:
      type: object
      properties:
        place:
          type: integer
        nickname:
          type: string
        teamName:
          type: ["string", "null"]
        solvedCount:
          type: integer
        finished:
          type: boolean
        durationMs:
          type: ["integer", "null"]
      required: [place, nickname, teamName, solvedCount, finished, durationMs]
    GameSession:
      type: object
      properties:
        gameId:
          type: integer
        title:
          type: string
        description:
          type: string
        nickname:
          type: string
        teamName:
          type: ["string", "null"]
        organizerName:
          type: string
        organizerScore:
          type: integer
        joinedAt:
          type: string
        finishedAt:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
        finished:
          type: boolean
        solvedCount:
          type: integer
        total:
          type: integer
        current:
          oneOf:
            - $ref: "#/components/schemas/GameCheckpointView"
            - type: "null"
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/GameRankingEntry"
        myRating:
          type: ["integer", "null"]
      required: [gameId, title, description, nickname, teamName, organizerName, organizerScore, joinedAt, finishedAt, durationMs, finished, solvedCount, total, current, ranking, myRating]
    OrganizerGame:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        joinCode:
          type: string
        createdAt:
          type: string
        organizerScore:
          type: integer
        checkpoints:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              position:
                type: integer
              hint:
                type: string
              lat:
                type: number
              lng:
                type: number
              answerCode:
                type: string
              hasImage:
                type: boolean
            required: [id, position, hint, lat, lng, answerCode, hasImage]
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/GameRankingEntry"
      required: [id, title, description, joinCode, createdAt, organizerScore, checkpoints, ranking]
