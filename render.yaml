services:
  - type: web
    name: pysnecompl
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:production
    startCommand: pnpm run start:production
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PYSNE_PREVIEW_READ_ONLY
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
